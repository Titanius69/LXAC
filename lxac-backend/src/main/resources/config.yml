# LXAC Configuration

settings:
  prefix: "&c[LXAC] &7"
  velocity-bridge: true
  channel: "lxac:flag"
  server-name: ""

violations:
  decay-interval-seconds: 8
  decay-amount: 1
  full-reset-after-seconds: 45
  max-violations: 100

checks:
  FlightA:
    enabled: true
    threshold: 30
  NukerA:
    enabled: true
    threshold: 4
  NukerB:
    enabled: true
    threshold: 4
  NukerC:
    enabled: true
    threshold: 4
  ReachA:
    enabled: true
    threshold: 12
  FastBreakA:
    enabled: true
    threshold: 10
  BreakThroughA:
    enabled: true
    threshold: 10
  BaritoneA:
    enabled: true
    threshold: 5
  BaritoneB:
    enabled: true
    threshold: 5
  BaritoneC:
    enabled: true
    threshold: 2
  RoboticA:
    enabled: true
    threshold: 5
  DigDebug:
    enabled: false
    threshold: 999
